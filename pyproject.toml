[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ISRpy"
version = "0.0.30"
description = "Utility and application modules for incoherent scatter radar (ISR) and coherent scatter radar (CSR) data processing and modeling."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Pablo M. Reyes", email = "pablo.reyes@sri.com"},
  {name = "Erhan Kudeki", email = "erhan@illinois.edu"},
]
dependencies = ["numpy", "scipy"]

[tool.setuptools]
# Automatically discover source packages
packages = {find = {}}


[tool.setuptools.package-data]
ISRpy = ["igrfdata/*.txt", "igrfdata/*.DAT"]
